[package]
name = "byc_tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
byc_core = { path = "../byc_core" }
byc_frontend = { path = "../byc_frontend" }
byc_semantic = { path = "../byc_semantic" }
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
semver = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
