name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18-dev libpolly-18-dev libzstd-dev pkg-config
          # Verify Polly is findable
          ls /usr/lib/llvm-18/lib/libPolly* 2>/dev/null || echo "No Polly static lib found"
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@18
          brew link --overwrite llvm@18
          echo "LLVM_SYS_181_PREFIX=$(brew --prefix llvm@18)" >> $GITHUB_ENV
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH

      - name: Verify LLVM
        run: |
          llvm-config --version || llvm-config-18 --version || echo "No llvm-config found"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --bin by --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy (strict)
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Security audit (RustSec)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: Build release
        run: |
          cargo build --release --bin by --locked
          cargo build --release -p byc_runtime --locked

      - name: Smoke test
        run: |
          ./target/release/by --version
          ./target/release/by help

      - name: E2E tests (.by)
        run: ./scripts/test-by.sh

  test-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 (ARM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18-dev libpolly-18-dev libzstd-dev pkg-config || \
            sudo apt-get install -y -qq llvm-18-dev libzstd-dev pkg-config
          ls /usr/lib/llvm-18/lib/libPolly* 2>/dev/null || echo "No Polly static lib found"
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Verify LLVM
        run: llvm-config-18 --version || echo "No llvm-config found"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --bin by --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: |
          cargo build --release --bin by --locked
          cargo build --release -p byc_runtime --locked

      - name: Smoke test
        run: |
          ./target/release/by --version
          ./target/release/by help

      - name: E2E tests (.by)
        run: ./scripts/test-by.sh

