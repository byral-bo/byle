[workspace]
resolver = "2"
members = [
    "crates/byc_core",
    "crates/byc_frontend",
    "crates/byc_hir",
    "crates/byc_semantic",
    "crates/byc_mir",
    "crates/byc_backend",
    "crates/byc_driver",
    "crates/byc_cli",
    "crates/byc_runtime",
    "crates/byc_tools",
    "crates/byc_platform",
    "crates/byc_runtime_wasm",
    "crates/byc_ui",
]
default-members = [
    "crates/byc_core",
    "crates/byc_frontend",
    "crates/byc_hir",
    "crates/byc_semantic",
    "crates/byc_mir",
    "crates/byc_backend",
    "crates/byc_driver",
    "crates/byc_cli",
    "crates/byc_runtime",
    "crates/byc_tools",
    "crates/byc_platform",
]

[workspace.package]
version = "0.8.9"
edition = "2024"
authors = ["Kynera"]
license = "MIT"

[profile.release]
# LTO disabled for now — LLVM version mismatch between Byle (18.1) and Rust
# makes cross-boundary LTO unreliable. Inline list ops in codegen provide
# the performance gain without LTO complexity.
panic = "abort"

[profile.dev]
panic = "abort"

[workspace.dependencies]
# LLVM bindings — enabled when Phase 3 begins
# inkwell = { version = "0.11", features = ["llvm22-0"] }
# llvm-sys = "220"
